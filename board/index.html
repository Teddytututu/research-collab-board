<!doctype html>
<html lang="zh-CN">
<head>
<script id="theme-boot">document.documentElement.className = "theme-" + ((localStorage.getItem("boardTheme") || "default").replace("ztmy", "pink"));</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_TITLE__</title>
<link rel="stylesheet" href="/discussion.css">
<link rel="stylesheet" href="/room-features.css">
<link rel="stylesheet" href="/identity.css">

<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e3e6eb;--ink:#1d232b;--muted:#69737f;--blue:#2459c4;--red:#c62f2f;--redbg:#fff5f5;--green:#23824a;--amber:#a86200;--side:176px}
*{box-sizing:border-box}
body{overflow-wrap:anywhere;margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
a{color:var(--blue)}
nav{position:fixed;left:0;top:0;bottom:0;width:var(--side);padding:22px 12px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;z-index:5}
nav .brand{font-weight:700;font-size:15px;margin:0 8px 12px}
nav a{display:block;padding:8px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;border:1px solid transparent}
nav a:hover{background:#f0f3f8}
nav a.on{background:#eaf0fb;border-color:#c9d7f3;color:var(--blue);font-weight:600}
nav .badge{float:right;background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;line-height:20px}
nav .stamp{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{margin-left:var(--side);padding:26px 34px 80px;max-width:1080px}
section{scroll-margin-top:16px;margin-bottom:30px}
h2{font-size:19px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.muted{color:var(--muted)}
.small{font-size:13px}

#todo .card{border:2px solid var(--red);background:var(--redbg)}
.todo-item{padding:10px 0;border-bottom:1px solid #f1d6d6}
.todo-item:last-child{border-bottom:0}
.todo-top{display:flex;justify-content:space-between;gap:12px;font-weight:650}
.todo-when{color:var(--red);white-space:nowrap}

details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
details>summary{cursor:pointer;padding:11px 16px;font-weight:650;list-style-position:inside}
details>.body{padding:2px 16px 12px}
details details{border-radius:9px}

.day h3{font-size:16px;margin:0 0 6px}
.slot{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid #f0f1f4;align-items:baseline}
.slot:first-of-type{border-top:0}
.slot .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.slot.now{background:#fff8e6;border-radius:8px;margin:0 -8px;padding:7px 8px}
.slot.now .t::after{content:" · 现在";color:var(--amber);font-weight:600}
.kind{font-size:12px;border-radius:6px;padding:1px 8px;background:#eef1f5;color:#4b5563;white-space:nowrap}
.k-考试{background:var(--red);color:#fff}.k-作业{background:#fff0d9;color:var(--amber)}.k-复习{background:#e7efff;color:var(--blue)}.k-休息{background:#e6f5ec;color:var(--green)}
.slot.exam .w{font-weight:700;color:var(--red)}
.later-day{margin:10px 0 4px;font-weight:650}

.line{padding:9px 0;border-top:1px solid #f0f1f4}.line:first-child{border-top:0}
.line b{display:block}
.run{display:grid;grid-template-columns:1fr 160px 96px;gap:12px;align-items:center;padding:6px 0;font-size:14px}
.bar{height:8px;background:#e9edf2;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.run.done .bar i{background:var(--green)}

.mm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px;overflow-x:auto;margin-bottom:12px}
.mm-title{font-size:13px;color:var(--muted);margin:0 0 8px}
.kids{display:flex;flex-direction:column;justify-content:center;position:relative;padding-left:26px;margin:0;list-style:none}
.kids::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:2px solid #c9d2de}
.kids>li{position:relative;display:flex;align-items:center;padding:5px 0 5px 22px}
.kids>li::before{content:"";position:absolute;left:0;top:50%;width:22px;border-top:2px solid #c9d2de}
.kids>li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid #c9d2de}
.kids>li:first-child::after{top:50%}.kids>li:last-child::after{bottom:50%}.kids>li:only-child::after{display:none}
.root{display:flex;align-items:center}
.nd{flex:none;width:178px;background:#fff;border:1.5px solid #d6dde7;border-left:5px solid var(--blue);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.45;cursor:pointer;transition:box-shadow .15s,transform .15s}
.nd:hover{box-shadow:0 3px 10px rgba(30,50,90,.12);transform:translateY(-1px)}
.nd.sel{box-shadow:0 0 0 3px #bcd0f5}
.nd.lv0{width:150px;font-weight:700;font-size:14px;background:#f4f7fd}
.nd.st-done{border-left-color:var(--green)}.nd.st-todo{border-left-color:#e0a030}.nd.st-doing{border-left-color:var(--blue)}
.nd .st{display:block;font-size:11px;font-weight:600;margin-bottom:1px}
.st-done .st{color:var(--green)}.st-doing .st{color:var(--blue)}.st-todo .st{color:var(--amber)}
.nd .cnt{display:inline-block;margin-top:3px;font-size:11px;color:var(--muted);background:#f1f3f6;border-radius:6px;padding:0 6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.nd{position:relative}
.tog{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid #c9d2de;color:var(--blue);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.tog:hover{background:#eef3fc}
.nd .cnt+.cnt{margin-left:4px}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.tools .legend{margin:0 auto 0 0}
.drawer-bg{position:fixed;inset:0;background:rgba(20,30,45,.25);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:21;box-shadow:-8px 0 24px rgba(20,30,45,.15);padding:20px 22px;overflow-y:auto;transform:translateX(100%);transition:transform .2s}
.drawer.on{transform:none}.drawer-bg.on{display:block}
.drawer h3{margin:0 0 6px;font-size:17px;padding-right:56px}
.drawer .x{position:absolute;right:16px;top:16px}
.drawer h4{margin:16px 0 6px;font-size:14px;color:var(--muted)}
.dtask{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid #f0f1f4;font-size:14px}.dtask:first-of-type{border-top:0}
#msg-body summary,#msg-body pre,.task .n,.slot .w,.todo-item{overflow-wrap:anywhere;word-break:break-word;min-width:0}
#msg-body pre{max-width:100%;white-space:pre-wrap;font:14px/1.7 inherit;font-family:inherit;margin:4px 0 0;color:#333b45}
.card,details{min-width:0;max-width:100%}
#detail h3{margin:0 0 4px;font-size:16px}

.node>summary .chip,.chip{font-size:12px;border-radius:6px;padding:1px 8px;margin-right:8px;font-weight:600;white-space:nowrap}
.s-done{background:#e6f5ec;color:var(--green)}.s-doing{background:#e7efff;color:var(--blue)}.s-todo{background:#fff0d9;color:var(--amber)}
.node-sum{font-weight:400;color:var(--muted);font-size:14px;margin:2px 0 6px}
.leaf{padding:8px 12px;border-left:3px solid var(--line);margin:6px 0 6px 4px}
.res>summary{font-weight:500;font-size:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;margin:6px 0;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}

.group{margin-bottom:12px}
.group h3{font-size:14px;color:var(--muted);margin:0 0 4px;font-weight:600}
.task{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid #f0f1f4}
.task:first-of-type{border-top:0}
.task .n{flex:1}.task .id{color:#a0a7b0;font-size:12px}
.who{font-size:12px;color:var(--muted)}
#task-body .task-group{margin:0 0 22px;min-width:0}
#task-body .task-group:last-child{margin-bottom:0}
#task-body .task-heading{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:14px;color:var(--task-heading,var(--ink));font-weight:700}
#task-body .task-heading::after{content:"";flex:1;height:1px;background:var(--task-line,var(--line));margin-left:4px}
#task-body .task-count{font:600 11px/1.5 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
#tasks #task-body details.task{display:block;padding:0;margin:0;border:0;border-bottom:1px dashed var(--task-line,var(--line));border-radius:0;background:transparent;box-shadow:none;outline:0;min-width:0}
#tasks #task-body .task-summary{display:grid;grid-template-columns:76px minmax(0,1fr) 12px;gap:12px;align-items:center;padding:11px 0;margin:0;list-style:none;cursor:pointer;font:inherit;min-width:0}
#task-body .task-summary::-webkit-details-marker{display:none}
#tasks #task-body .task-summary::before{display:none;content:none}
#tasks #task-body .task-summary::after{content:"＋";position:static;float:none;margin:0;color:var(--muted);font-size:13px;line-height:1}
#tasks #task-body .task[open]>.task-summary::after{content:"−"}
#tasks #task-body .task-summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
#tasks #task-body .task-labels{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
#tasks #task-body .task .chip{border:0;border-radius:3px!important;transform:none;white-space:nowrap;font:600 11px/1.7 var(--sans);padding:1px 7px}
#task-body .task-run{background:var(--task-run-bg);color:var(--task-run-ink)}
#task-body .task-review{background:var(--task-review-bg);color:var(--task-review-ink)}
#task-body .task-queue{background:var(--task-queue-bg);color:var(--task-queue-ink)}
#task-body .task-blocked{background:var(--task-blocked-bg);color:var(--task-blocked-ink)}
#tasks #task-body .task .n{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;overflow-wrap:normal;word-break:normal;line-height:1.65}
#task-body .task-owner{font-size:10px;line-height:1.5;color:var(--muted)}
#tasks #task-body .task>.body{padding:0 24px 12px 88px;margin:0;color:var(--ink);font-size:13px;line-height:1.8;overflow-wrap:anywhere}
#tasks #task-body .task-wait{background:transparent;box-shadow:none;outline:0;border:0;border-top:1px solid var(--task-line,var(--line));border-radius:0;padding:14px 0 0;margin:8px 0 0}
#task-body .task-detail{margin:0 0 6px}
#task-body .task-detail:last-child{margin-bottom:0}
#task-body .task-detail-label{font-weight:600;color:var(--muted)}
#tasks #task-body .task-static>.task-summary{cursor:default}
#tasks #task-body .task-static>.task-summary::after{content:""}
#task-body .task-wait>summary{font-size:12px;color:var(--muted);cursor:pointer}
#task-body .task-wait>.body{padding-top:16px}
@media(max-width:820px){
  #tasks #task-body{padding-left:14px;padding-right:14px}
  #tasks #task-body .task-summary{grid-template-columns:minmax(0,1fr) 12px;gap:6px 10px;padding:12px 0}
  #tasks #task-body .task-labels{grid-column:1;grid-row:1;flex-direction:row;align-items:center;gap:8px}
  #tasks #task-body .task-summary::after{grid-column:2;grid-row:1}
  #tasks #task-body .task .n{grid-column:1/-1;grid-row:2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;overflow-wrap:anywhere;font-size:14px}
  #tasks #task-body .task>.body{padding:0 0 12px}
}

.msg{border-top:1px solid #f0f1f4;padding:8px 0}.msg:first-child{border-top:0}
.msg pre{white-space:pre-wrap;font:inherit;margin:4px 0 0;font-size:14px}
button{font:inherit;font-size:13px;border:0;background:#eef3fc;color:var(--blue);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-weight:600}button:hover{background:#dfe8fa}
.file{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #f0f1f4}.file:first-child{border-top:0}
.file-name{display:flex;align-items:center;gap:10px;min-width:0}.kind{flex-shrink:0;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;background:#eef1f5;color:#5d6977}.k-html{background:#e6efff;color:#2459c4}.k-md{background:#eaf6ee;color:#1f7a4c}.k-dir{background:#fff3e0;color:#a35a00}.k-web{background:#f1e9ff;color:#6a3fb5}.k-pdf{background:#fdecec;color:#b33a3a}.file-acts{display:flex;gap:6px;flex-shrink:0}.file-acts .ghost{background:transparent;color:var(--muted);border:1px solid #e3e6eb}.file-acts a.btn{text-decoration:none;font-size:13px;background:#eef3fc;color:var(--blue);border-radius:999px;padding:5px 14px;font-weight:600}
.file code{font-size:12px;color:var(--muted);word-break:break-all}
@media(max-width:820px){nav{position:sticky;bottom:auto;width:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}nav .brand,nav .stamp{display:none}nav a{white-space:nowrap}main{margin-left:0;padding:16px}section{scroll-margin-top:64px}.slot{grid-template-columns:96px 1fr}.slot .kind{display:none}.run{grid-template-columns:1fr 90px 56px}}












#files .card.fgrid{background:transparent;border:0;box-shadow:none;padding:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{position:relative;display:flex;align-items:center;gap:12px;padding:12px 40px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.fcard:hover,.fcard:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.08);border-color:#cfd6e0;outline:none}
.ftile{flex-shrink:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.3px;background:#eef1f5;color:#4b5563}
.k-html .ftile{background:#e6efff;color:#2459c4}.k-md .ftile{background:#eaf6ee;color:#1f7a4c}.k-dir .ftile{background:#fff3e0;color:#a35a00}
.k-web .ftile{background:#f1e9ff;color:#6a3fb5}.k-pdf .ftile{background:#fdecec;color:#b33a3a}
.ftext{min-width:0;display:grid;gap:2px}
.fname{font-weight:650;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsub.ok{color:var(--green)}.fsub.bad{color:var(--red)}
.fcopy{position:absolute;top:8px;right:8px;width:28px;height:28px;padding:0;border-radius:8px;font-size:14px;line-height:28px;background:transparent!important;color:var(--muted)!important;border:1px solid transparent;opacity:0;transition:opacity .15s,background .15s;box-shadow:none!important;transform:none!important}
.fcard:hover .fcopy,.fcard:focus-within .fcopy{opacity:1}
.fcopy:hover{background:rgba(127,127,127,.12)!important;color:var(--ink)!important}
@media (hover:none){.fcopy{opacity:1}}






.rgroups{display:grid;gap:16px;padding:6px 2px 4px}
.rghead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.rgname{font-weight:700;font-size:14px}
.rgcount{font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;background:#eef1f5;color:#5d6977;line-height:20px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.rcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);display:grid;gap:3px;min-width:0}
.rcname{font-size:13px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcmeta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}







.drawer{padding:22px 22px 30px;background:#f8f9fb}
.drawer h3{display:flex;align-items:center;gap:10px;font-size:18px;line-height:1.4}
.drawer h4{margin:22px 0 10px;font-size:12px;letter-spacing:1px;color:#667085;text-transform:uppercase}
.dsummary{margin:10px 0 4px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);font-size:15px;line-height:1.7}
.dsummary.st-done{border-left-color:var(--green)}.dsummary.st-todo{border-left-color:#e0a030}
.dtask{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.rcardx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;display:grid;gap:10px}
.rxhead{display:flex;gap:12px;align-items:flex-start}
.rxstat{flex-shrink:0;min-width:64px;height:56px;border-radius:10px;display:grid;place-content:center;text-align:center;background:#eef1f5;color:#344054;line-height:1.1}
.rxstat b{font-size:22px;font-variant-numeric:tabular-nums}.rxstat small{font-size:11px;color:inherit;opacity:.8}
.rxstat.up{background:#e7f6ee;color:#1f7a4c}.rxstat.down{background:#fdecec;color:#b33a3a}
.rxtitle{min-width:0;display:grid;gap:6px}
.rxname{font-weight:700;font-size:15px;line-height:1.5}
.rxmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rxchip{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;background:#eef3fc;color:#2459c4}
.rxscope{font-size:12px;color:var(--muted);line-height:1.6}
.rxtake{font-size:14px;line-height:1.7;padding:10px 12px;border-radius:8px;background:#f6f8fb;border-left:3px solid #98a2b3}
.rcardx details{margin:0;border-radius:8px;box-shadow:none}
.rcardx details>summary{font-size:13px;padding:8px 12px;color:#475467}
.rcardx .tw{overflow-x:auto}.rcardx table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.rcardx th,.rcardx td{border-bottom:1px solid #eef0f3;padding:6px 8px;text-align:left}.rcardx th{color:#667085;font-weight:600;font-size:12px;background:#fafbfc}
.rxnote{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:8px}
.rxsub{font-size:12.5px;font-weight:700;margin-top:10px;color:#344054}
.rxdetails{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.7;display:grid;gap:4px}



.nd.has-thumb{position:relative;padding-right:56px}
.ndthumb{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.dhero{margin:12px 0 4px}.dhero img{display:block;width:100%;height:auto;max-height:420px;aspect-ratio:auto;object-fit:contain;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.dhero figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.rximgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rximgs figure{margin:0;display:grid;gap:3px;min-width:0}
.rximgs img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.rximgs figcaption{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


.rxhead2{display:flex;align-items:center;gap:10px}
.rxverdict{flex-shrink:0;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.v-good{background:#e7f6ee;color:#1f7a4c}.v-mixed{background:#fff4e5;color:#b54708}.v-bad{background:#fdecec;color:#b33a3a}.v-info{background:#eef3fc;color:#2459c4}
.rcardx .rxname{font-weight:700;font-size:15px}


.slot.now .t::after{content:none!important}
#runs details.rgroup{margin:0;padding:10px 4px;border:0;border-radius:0;outline:0;background:transparent;box-shadow:none;border-bottom:1px dashed var(--line)}
#runs details.rgroup>summary.rghead{cursor:pointer;margin:0;list-style:none}

<script>
(async () => { await BoardIdentity.ready;
const $ = s => document.querySelector(s);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const openState = new Map();             // keep folds as the user left them across refreshes
function fold(key, title, defaultOpen, cls) {
  const d = el('details', cls); d.dataset.key = key;
  d.open = openState.has(key) ? openState.get(key) : defaultOpen;
  d.addEventListener('toggle', () => openState.set(key, d.open));
  const s = el('summary'); if (typeof title === 'string') s.textContent = title; else s.append(...title);
  const b = el('div', 'body'); d.append(s, b); return [d, b];
}
function linkOrText(v) {
  if (/^https?:\/\//.test(v || '')) { const a = el('a', null, v); a.href = v; a.target = '_blank'; a.rel = 'noopener'; return a; }
  return el('span', 'muted', v || '');
}
const pad = n => String(n).padStart(2, '0');
function md(d) { return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function whenClass(w) {  // urgency pill: today/overdue -> urgent, within 3 days -> soon
  if (/现在|今天|马上|立刻/.test(w)) return 'w-urgent';
  const m = w.match(/(\d{1,2})-(\d{1,2})/); if (!m) return 'w-later';
  const now = new Date(), d = new Date(now.getFullYear(), +m[1] - 1, +m[2]), days = Math.floor((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return days <= 0 ? 'w-urgent' : days <= 3 ? 'w-soon' : 'w-later';
}
function renderTodo(todo) {
  const box = $('#todo-list'); box.replaceChildren();
  $('#todo-n').textContent = todo.length || '';
  if (!todo.length) { box.append(el('div', 'muted', '现在没有要你做的事。')); return; }
  for (const t of todo) {
    const wc = whenClass(t.when || ''), it = el('div', 'todo-item ' + wc), top = el('div', 'todo-top');
    top.append(el('span', 'todo-what', t.what), el('span', 'todo-when ' + wc, t.when || ''));
    it.append(top);
    if (t.why) it.append(el('div', 'muted small', t.why));
    if (t.how) { const h = el('div', 'small todo-how'); h.append(linkOrText(t.how)); it.append(h); }
    box.append(it);
  }
}



function slotRow(s, isToday) {
  const r = el('div', 'slot' + (s.kind === '考试' ? ' exam' : ''));
  r.append(el('span', 't', s.time), el('span', 'w', s.what), el('span', 'kind k-' + s.kind, s.kind));
  if (isToday) {
    const m = (s.time || '').match(/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/);
    if (m) { const now = new Date(), cur = now.getHours() * 60 + now.getMinutes();
      let a = +m[1] * 60 + +m[2], b = +m[3] * 60 + +m[4]; if (b < a) b += 1440;
      if (cur >= a && cur < b) r.classList.add('now'); }
  }
  return r;
}
function renderPlan(days) {
  const box = $('#plan-body'); box.replaceChildren();
  const now = new Date(), today = md(now), tom = md(new Date(now.getTime() + 864e5));
  let todayDay = null, tomDay = null; const later = [];
  for (const d of days) {
    const ds = (d.date.match(/\d{2}-\d{2}/g) || []);
    const first = ds[0], last = ds[ds.length - 1];
    if (first && last < today) continue;                         // already past
    if (first === today && ds.length === 1) todayDay = d;
    else if (first === tom && ds.length === 1) tomDay = d;
    else later.push(d);
  }
  const t = el('div', 'card day');
  t.append(el('h3', null, todayDay ? '今天 · ' + todayDay.date : '今天'));
  if (todayDay) for (const s of todayDay.items) t.append(slotRow(s, true)); else t.append(el('div', 'muted', '今天没有排具体安排。'));
  box.append(t);
  if (tomDay) { const [d, b] = fold('plan-tomorrow', '明天 · ' + tomDay.date, false); for (const s of tomDay.items) b.append(slotRow(s)); box.append(d); }
  if (later.length) { const [d, b] = fold('plan-later', '后面的安排', false);
    for (const day of later) { b.append(el('div', 'later-day', day.date)); for (const s of day.items) b.append(slotRow(s)); }
    box.append(d); }
}

const CODE = /（?\(?T\d{3}\)?）?/g;
function taskNames(groups) { const m = {}; for (const g of groups || []) for (const t of g.tasks) m[t.id] = t.name; return m; }
function renderProgress(o) {
  const L = $('#lines'); L.replaceChildren();
  for (const p of o.progress_lines || []) { const r = el('div', 'line'); r.append(el('b', null, p.line), el('span', null, p.text)); L.append(r); }
  const names = taskNames(o.task_groups), R = $('#runs'); R.replaceChildren();
  const runs = (o.runs || []).map(r => { const id = (r.name.match(/T\d{3}/) || [])[0];
    return {...r, label: (id && names[id]) || r.name.replace(CODE, '').trim()}; });
  const active = runs.filter(r => r.done < r.total), done = runs.filter(r => r.done >= r.total);
  const row = r => { const x = el('div', 'run' + (r.done >= r.total ? ' done' : '')); const bar = el('div', 'bar'), i = el('i');
    i.style.width = Math.min(100, 100 * r.done / Math.max(1, r.total)) + '%'; bar.append(i);
    x.append(el('span', null, r.label), bar, el('span', 'muted small', r.done + ' / ' + r.total)); if(r.eta){const detail=el('details','eta-run'+(r.eta.confidence==='低'?' eta-low':'')+(r.eta.overdue?' eta-overdue':''));detail.append(el('summary','eta-label',EtaView.label(r.eta)),el('p','eta-basis',EtaView.detail(r.eta)));x.append(detail);}return x; };
  if (active.length) { const c = el('div', 'card'); c.style.marginTop = '10px'; c.append(el('div', 'muted small', '正在跑的实验')); active.forEach(r => c.append(row(r))); R.append(c); }
  if (done.length) { const [d, b] = fold('runs-done', '已跑完的实验（' + done.length + '）', false);
    const order = ['DraCo 复现与判分', '提前读出', '修改与回退', '视频', '文献与代码', '其他'], groups = {};
    done.forEach(r => (groups[r.line || '其他'] = groups[r.line || '其他'] || []).push(r));
    const keys = Object.keys(groups).sort((a, z) => (order.indexOf(a) + 99) % 99 - (order.indexOf(z) + 99) % 99);
    const wrap = el('div', 'rgroups');
    for (const k of keys) { const g = el('details', 'rgroup'), head = el('summary', 'rghead');
      g.open = localStorage.getItem('rg:' + k) === '1'; g.addEventListener('toggle', () => localStorage.setItem('rg:' + k, g.open ? '1' : '0'));
      head.append(el('span', 'rgname', k), el('span', 'rgcount', String(groups[k].length))); g.append(head);
      const grid = el('div', 'rgrid');
      for (const r of groups[k]) { const c = el('div', 'rcard'); c.title = r.note || '';
        c.append(el('div', 'rcname', r.label), el('div', 'rcmeta', [r.where, r.total ? r.total + ' ' + (r.unit || '项') : ''].filter(Boolean).join(' · ')));
        grid.append(c); }
      g.append(grid); wrap.append(g); }
    b.append(wrap); R.append(d); }
}

const ST = {done: ['已完成', 's-done'], doing: ['进行中', 's-doing'], todo: ['待做', 's-todo']};
function statOf(title) {  // pull the headline number out of a result title, e.g. "多10张" -> +10
  if (/(减少|少了|下降)/.test(title) && /(多|增加|提高|提升)/.test(title)) return null;  // mixed directions: no single headline number
  const bad = /(损坏|毛病|错误|误报|失败|崩)/.test(title);  // for these, going up is bad
  let m = title.match(/(?:多|增加|提高|提升|涨|\+)\s*(\d+(?:\.\d+)?)\s*(张|%|段|个|分)?/);
  if (m) return ['+' + m[1] + (m[2] === '%' ? '%' : ''), bad ? 'down' : 'up', m[2] && m[2] !== '%' ? m[2] : ''];
  m = title.match(/(?:减少|少了|下降|降|−)\s*(\d+(?:\.\d+)?)\s*(张|%|段|个|分)?/);
  if (m) return ['−' + m[1] + (m[2] === '%' ? '%' : ''), bad ? 'up' : 'down', m[2] && m[2] !== '%' ? m[2] : ''];
  m = title.match(/(\d+(?:\.\d+)?)\s*(%|张|段)/);
  return m ? [m[1] + (m[2] === '%' ? '%' : ''), 'flat', m[2] === '%' ? '' : m[2]] : null;
}
const VERDICT = {good: ['有效', 'v-good'], mixed: ['一般', 'v-mixed'], bad: ['有短板', 'v-bad'], info: ['结论', 'v-info']};
function wireImageZoom(image, files, selected) {

function renderTree(o) {

  };

    const kids = n.children || [];

function taskState(t) { return LifecycleView.taskState(t); }

function plainStatus(t) {
  const s = taskState(t); return [s.label, s.done ? 's-done' : s.rank < 2 ? 's-doing' : 's-todo'];
}
function taskCategory(title, group) { return String(group || '其他').split(' › ')[0]; }
function taskDetailRows(task, meta, overview) {
  const descriptions = {};
  const spec = descriptions[task.id] || [], rows = [];
  // Expanded task details contain goal, deliverable and one current update.
  const norm = x => String(x||'').replace(/[\s·:：,，。;；()（）]/g,'');
  const add = (label,text) => { if (text) rows.push({label,text:String(text)}); };
  add('目标', meta.description || spec[0]); add('交付', meta.deliverable || spec[1]);
  const run = (overview.runs || []).find(r => r.task_id === task.id || r.id === task.id);
  const timing = norm(EtaView.task(task, run));
  const status = String(task.status || '').replace(CODE,'前置任务').trim();
  const cands = [run?.note, /^(进行中|待验收|待领|排队|通过)$/.test(status) ? '' : status].filter(Boolean);
  const frac = c => (String(c).match(/\d+\/\d+/)||[''])[0];
  const tfrac = frac(EtaView.task(task, run));
  const now = cands.find(c => { const n = norm(c); if (!n || /^现在做/.test(c)) return false; if (tfrac && frac(c) === tfrac && /^\d/.test(String(c).trim())) return false; return n !== timing && !timing.includes(n) && !n.startsWith(timing); });
  if (now) add('现在', now);
  return rows;
}
function taskEntries(o, tasks) {
  const meta = {};
  for (const group of o.task_groups || []) for (const task of group.tasks || []) meta[task.id] = {...task, group:group.group};
  return tasks.map(t => {
    const g = meta[t.id] || {}, title = g.name || (t.title || '').replace(CODE, '').trim();
    const category = taskCategory(title, g.group || '');
    const owner = g.who || t.owner || 'GPT';
    return {...taskState(t), id:t.id, title, category, owner, eta:t.eta||o.task_etas?.[t.id], timing:EtaView.task({...t,eta:t.eta||o.task_etas?.[t.id]},(o.runs||[]).find(r=>r.task_id===t.id||r.id===t.id)), progress:EtaView.progress(t,(o.runs||[]).find(r=>r.task_id===t.id||r.id===t.id)), details:taskDetailRows(t,g,o)};
  }).filter(t => !t.done).sort((a,b) => a.rank - b.rank);
}

  };

  window.addEventListener('overview',ev=>{overview=ev.detail.overview||{};tasks=ev.detail.tasks||[];render();});
  render();setInterval(render,300000);
})();
</script>
<script id="character-ui">
(() => {
  const order=['owner','Claude','GPT'];
  const headerOrder=['Claude'];
  const group=document.querySelector('.brand-people');
  if(!group || !window.BoardIdentity)return;
  let dialog, portrait, title, error, trigger;
  function show(account,button){
    if(!dialog){
      dialog=document.createElement('dialog');dialog.className='character-portrait-dialog';
      dialog.setAttribute('aria-labelledby','character-portrait-title');
      const header=document.createElement('header');
      title=document.createElement('h2');title.id='character-portrait-title';
      const close=document.createElement('button');close.type='button';close.textContent='关闭';close.autofocus=true;
      close.setAttribute('aria-label','关闭头像大图');close.onclick=()=>dialog.close();
      portrait=document.createElement('img');
      error=document.createElement('p');error.className='character-portrait-error';error.textContent='图片正在准备，请稍后再试。';error.hidden=true;
      portrait.onerror=()=>{error.hidden=false;};portrait.onload=()=>{error.hidden=true;};
      header.append(title,close);dialog.append(header,portrait,error);document.body.append(dialog);
      dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left || event.clientX>box.right || event.clientY<box.top || event.clientY>box.bottom)dialog.close();}});
      dialog.addEventListener('close',()=>trigger?.focus({preventScroll:true}));
    }
    trigger=button;title.textContent=account.display_name;portrait.alt=account.display_name+'头像大图';error.hidden=true;
    portrait.src=BoardIdentity.avatarURL(account.id,account.avatar.full || account.avatar.file);dialog.showModal();
  }
  function render(){
    const buttons=[];
    for(const id of headerOrder){
      const account=BoardIdentity.accounts.find(row=>row.id===id);
      if(!account?.avatar?.file)continue;
      const button=document.createElement('button');button.type='button';button.className='brand-person';button.dataset.character=id;
      button.title=account.display_name;button.setAttribute('aria-label','查看'+account.display_name+'头像');
      const frame=document.createElement('span');frame.className='brand-person-frame';
      const image=document.createElement('img');image.alt='';image.draggable=false;image.src=BoardIdentity.avatarURL(id,account.avatar.file);
      const a=account.avatar;
      if(/^\d+(?:\.\d+)?%$/.test(a.cropWidth || '') && /^-?\d+(?:\.\d+)?%$/.test(a.cropLeft || '') && /^-?\d+(?:\.\d+)?%$/.test(a.cropTop || '')){
        Object.assign(image.style,{position:'absolute',width:a.cropWidth,height:'auto',left:a.cropLeft,top:a.cropTop});
      }
      frame.append(image);button.append(frame);button.onclick=()=>show(account,button);buttons.push(button);
    }
    group.replaceChildren(...buttons);
  }
  window.addEventListener('accountschange',render);BoardIdentity.ready.then(render).catch(()=>{});
})();
</script>
